# Menu, matching the board on the truck. Edit names, descriptions and prices here.
# price: number without "$" (e.g. "13.50"). Leave "" to hide the price.
# note: short availability note shown under the item (e.g. "Thursday–Saturday only").
# photo: file name (no extension) in assets/images/food/. Leave out for no photo.
# tags: spicy, popular
# featured: true shows the dish in "Fan favorites" on the home page.
