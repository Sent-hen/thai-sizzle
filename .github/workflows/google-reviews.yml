name: Refresh Google rating

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update _data/google.yml
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/update_google_rating.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh Google rating"
          git push
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so kick off the deploy directly.
      - name: Redeploy site
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || true
