{%- comment -%} Round badge logo: red emblem with curved wordmark. Param: id (unique suffix). {%- endcomment -%}
{%- assign lid = include.id | default: "a" -%}
<svg class="logo-badge {{ include.class }}" viewBox="0 0 200 200" role="img" aria-label="Thai Sizzle">
  <defs><path id="logo-arc-{{ lid }}" d="M 30,100 A 70,70 0 0 0 170,100"/></defs>
  <circle cx="100" cy="100" r="98" fill="var(--paper)"/>
  <circle cx="100" cy="78" r="56" fill="var(--red)"/>
  <circle cx="100" cy="78" r="46" fill="none" stroke="var(--paper)" stroke-width="5"/>
  <!-- bowl -->
  <path d="M68 80h64a32 26 0 0 1-64 0z" fill="var(--paper)"/>
  <rect x="86" y="104" width="28" height="6" rx="3" fill="var(--paper)"/>
  <!-- steam / flames -->
  <path d="M86 70c-6-8 6-12 0-22M100 70c-6-8 6-12 0-24M114 70c-6-8 6-12 0-22" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round"/>
  <text font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="800" font-size="27" letter-spacing="5" fill="var(--red)">
    <textPath href="#logo-arc-{{ lid }}" startOffset="50%" text-anchor="middle">THAI SIZZLE</textPath>
  </text>
</svg>
