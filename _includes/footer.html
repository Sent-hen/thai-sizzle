{%- assign b = site.business -%}
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <p class="footer-brand">Thai <em>Sizzle</em></p>
      <p>{{ site.tagline }}</p>
    </div>
    <div>
      <h2 class="footer-heading">Visit</h2>
      <address>
        {{ b.location_name }}<br>
        {{ b.street }}<br>
        {{ b.city }}, {{ b.region }} {{ b.postal }}
      </address>
    </div>
    <div>
      <h2 class="footer-heading">Contact</h2>
      <p><a href="tel:{{ b.phone_raw }}">{{ b.phone }}</a></p>
      <p><a href="{{ b.facebook }}" rel="noopener">Facebook</a></p>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>&copy; {{ site.time | date: "%Y" }} {{ b.name }}. All rights reserved.</p>
  </div>
</footer>
