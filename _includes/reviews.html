{%- assign g = site.data.google -%}
<section class="reviews" aria-labelledby="reviews-title">
  <div class="container">
    <h2 id="reviews-title" class="banner-title">What Mabank is saying</h2>
    <p class="center">{% include google-badge.html class="g-badge-pill" %}</p>
    <div class="review-grid">
      {%- for r in site.data.reviews limit: include.limit %}
      <figure class="review-card">
        <div class="bubble bubble-sm">
          {% include stars.html rating=r.rating %}
          <blockquote>“{{ r.quote }}”</blockquote>
        </div>
        <figcaption>{{ r.name }} <span>· {{ r.source }}</span></figcaption>
      </figure>
      {%- endfor %}
    </div>
    <div class="cta-row center">
      <a class="btn btn-outline" href="{{ g.maps_url }}" rel="noopener">All Google reviews</a>
      <a class="btn btn-primary" href="{% if g.place_id != '' %}https://search.google.com/local/writereview?placeid={{ g.place_id }}{% else %}{{ g.maps_url }}{% endif %}" rel="noopener">Leave a review</a>
    </div>
  </div>
</section>
